name: Snapshot

# ─────────────────────────────────────────────────────────────────────────────
#  Publica um snapshot a cada merge em `main`, para que consumidores possam
#  testar o que ainda não virou release.
#
#  Diferença de postura em relação ao release.yml: aqui a publicação é uma
#  conveniência, não um portão. Se os secrets ainda não existem, o job avisa e
#  segue verde — deixar a `main` vermelha por causa de um snapshot esconderia
#  falhas reais de código. Em release, secret faltando reprova.
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  qualidade:
    name: Qualidade
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar snapshot
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Conferir se dá para publicar
        id: checagem
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          VERSAO=$(grep '^VERSION_NAME=' gradle.properties | cut -d'=' -f2-)
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"

          # `gradle.properties` guarda a versão de desenvolvimento, que é sempre
          # um snapshot. Se alguém deixou uma versão final ali, publicar daqui
          # criaria uma release por acidente — e release é imutável.
          if [[ "$VERSAO" != *-SNAPSHOT ]]; then
            echo "::warning title=Versao nao e snapshot::VERSION_NAME=$VERSAO. Snapshots saem so de versoes -SNAPSHOT; releases saem do release.yml."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$MAVEN_CENTRAL_PASSWORD" ]; then
            echo "::notice title=Snapshot nao publicado::Secrets do Maven Central ainda nao configurados."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publicar=true" >> "$GITHUB_OUTPUT"

      # `continue-on-error` de propósito: snapshot é conveniência, não portão.
      # O job de qualidade já reprovou ou aprovou o commit antes daqui. Deixar a
      # `main` vermelha porque o Sonatype recusou um snapshot esconderia falha
      # real de código no histórico do branch — o resumo abaixo é que reporta.
      - name: Publicar o snapshot
        id: publicacao
        if: steps.checagem.outputs.publicar == 'true'
        continue-on-error: true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          # Snapshot não é assinado: o plugin só exige PGP fora de -SNAPSHOT.
          ./gradlew :design_system:publishToMavenCentral \
            --no-configuration-cache --stacktrace

      # Reporta o que de fato aconteceu. Antes lia `checagem.outputs.publicar`,
      # que diz apenas "a publicação foi tentada" — e por isso estampou
      # "Snapshot publicado" num run em que a publicação falhou.
      #
      # `outcome` é o resultado real do passo; `conclusion` viria mascarado como
      # `success` por causa do `continue-on-error`.
      - name: Resumo
        if: always()
        env:
          VERSAO: ${{ steps.checagem.outputs.versao }}
          GATE: ${{ steps.checagem.outputs.publicar }}
          RESULTADO: ${{ steps.publicacao.outcome }}
        run: |
          GRUPO=$(grep '^GROUP=' gradle.properties | cut -d'=' -f2-)
          ARTEFATO=$(grep '^POM_ARTIFACT_ID=' gradle.properties | cut -d'=' -f2-)
          COORDENADA="$GRUPO:$ARTEFATO:$VERSAO"

          if [ "$GATE" != "true" ]; then
            {
              echo "## Snapshot não publicado"
              echo
              echo "A qualidade passou; a publicação foi pulada de propósito."
              echo "Consulte o passo *Conferir se dá para publicar* para o motivo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RESULTADO" = "success" ]; then
            {
              echo "## Snapshot publicado"
              echo
              echo "\`$COORDENADA\`"
              echo
              echo '```kotlin'
              echo "repositories {"
              echo "    maven(\"https://central.sonatype.com/repository/maven-snapshots/\")"
              echo "}"
              echo "dependencies {"
              echo "    implementation(\"$COORDENADA\")"
              echo "}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Falhou. O job segue verde porque a qualidade passou, mas o aviso
          # precisa aparecer — e com o que olhar, não só "deu erro".
          echo "::warning title=Snapshot nao publicado::$COORDENADA falhou ao subir. A qualidade passou; veja o resumo do run."
          {
            echo "## Snapshot não publicado"
            echo
            echo "A qualidade passou — o commit está bom. O que falhou foi só o"
            echo "envio de \`$COORDENADA\` ao repositório de snapshots."
            echo
            echo "### Onde olhar"
            echo
            echo "O passo *Publicar o snapshot* traz o código HTTP da recusa:"
            echo
            echo "| Código | Significado | Causa provável |"
            echo "|---|---|---|"
            echo "| \`401\` | Autenticação falhou | User Token errado, trocado ou com espaço em branco |"
            echo "| \`403\` | Autenticado, sem permissão | Namespace \`$GRUPO\` não registrado ou não verificado no Central Portal |"
            echo
            echo "Passo a passo em \`docs/ci-cd.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
