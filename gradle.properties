# ── JVM / Gradle ─────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableR8.fullMode=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Coordenadas de publicação (Maven) ────────────────────────────────────────
# Sobrescreva via -P ou variável de ambiente ORG_GRADLE_PROJECT_*
GROUP=io.github.matheusbrum
POM_ARTIFACT_ID=mns-design-system
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=MNS Design System
POM_DESCRIPTION=Design System Android em Jetpack Compose, 100% tokenizavel e desacoplado.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/matheusbrum/mns-design-system
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_SCM_URL=https://github.com/matheusbrum/mns-design-system
POM_SCM_CONNECTION=scm:git:git://github.com/matheusbrum/mns-design-system.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/matheusbrum/mns-design-system.git
POM_DEVELOPER_ID=matheusbrum
POM_DEVELOPER_NAME=Matheus Brum
POM_DEVELOPER_URL=https://github.com/matheusbrum

# ── Cobertura mínima exigida (integração) ────────────────────────────────────
mns.coverage.minimum=90
