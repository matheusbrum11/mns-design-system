# ── JVM / Gradle ─────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# ── AndroidX ─────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.enableR8.fullMode=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official

# ── Coordenadas de publicação (Maven) ────────────────────────────────────────
# Lidas automaticamente pelo plugin com.vanniktech.maven.publish para montar o
# POM — não repita nada disso no build.gradle.kts.
# Sobrescreva via -P ou variável de ambiente ORG_GRADLE_PROJECT_*
GROUP=io.github.matheusbrum11
POM_ARTIFACT_ID=mns-design-system
# Versão de DESENVOLVIMENTO. Permanece `-SNAPSHOT` para sempre: a versão de
# release vem da tag da Release do GitHub (`v0.2.0` publica `0.2.0`), passada
# ao Gradle como `-PVERSION_NAME`. Ver docs/ci-cd.md.
VERSION_NAME=0.1.0-SNAPSHOT

POM_NAME=MNS Design System
POM_DESCRIPTION=Design System Android em Jetpack Compose, 100% tokenizavel e desacoplado.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/matheusbrum11/mns-design-system
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
# `distribution` no POM aceita "repo" ou "manual"; nunca uma URL. "repo" declara
# que o artefato pode ser baixado do próprio repositório Maven.
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/matheusbrum11/mns-design-system
POM_SCM_CONNECTION=scm:git:git://github.com/matheusbrum11/mns-design-system.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/matheusbrum11/mns-design-system.git
POM_DEVELOPER_ID=matheusbrum11
POM_DEVELOPER_NAME=Matheus Brum
POM_DEVELOPER_URL=https://github.com/matheusbrum11

# ── Credenciais de publicação (NUNCA commitadas) ─────────────────────────────
# O plugin espera estas propriedades Gradle. No CI elas chegam como variáveis de
# ambiente com o prefixo ORG_GRADLE_PROJECT_ (ver .github/workflows/release.yml);
# localmente, coloque-as em ~/.gradle/gradle.properties — jamais neste arquivo.
#
#   mavenCentralUsername        User Token gerado em central.sonatype.com
#   mavenCentralPassword        senha do mesmo User Token
#   signingInMemoryKey          chave PGP privada em ASCII armor
#   signingInMemoryKeyId        últimos 8 caracteres do ID da chave
#   signingInMemoryKeyPassword  senha da chave privada

# ── Cobertura mínima exigida (integração) ────────────────────────────────────
mns.coverage.minimum=90
